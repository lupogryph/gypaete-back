version: "3"

services:
  postgres:
    image: postgres:18-alpine
    container_name: gypaete_db
    restart: always
    environment:
      POSTGRES_USER: db
      POSTGRES_PASSWORD: Passw0rd
      POSTGRES_DB: gypaete_db
    ports:
      - "5432:5432"

  gypaete-back:
    build:
      context: .
      no_cache: true
    env_file:
      - .docker.env
    depends_on:
      - postgres
    ports:
      - "3000:3000"